# MLX LoRA Fine-Tuning Configuration
# Tailored for Apple Silicon (Metal) & Qwen 2.5 Instruct 4-bit

# Model configuration
model: "mlx-community/Qwen2.5-32B-Instruct-4bit"

# Dataset directory containing train.jsonl, valid.jsonl, test.jsonl
data: "data"

# Fine-tuning method: "lora", "dora", or "full"
fine_tune_type: "lora"

# LoRA hyperparameters
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.05

# Training hyperparameters
learning_rate: 1.0e-4
batch_size: 1
iters: 200
num_layers: 8

# Trade compute for lower activation memory on larger models
grad_checkpoint: true

# Prompt masking: compute loss ONLY on the assistant's response tokens
mask_prompt: true

# Maximum sequence length (tokens)
max_seq_length: 1024

# Evaluation & logging intervals
steps_per_report: 10
steps_per_eval: 25
val_batches: 10
save_every: 50

# Optimizer: adamw, adam, muon, sgd, adafactor
optimizer: "adamw"

# Path to save trained LoRA adapter weights
adapter_path: "artifacts/qwen2.5-32b/adapters"

# Random seed for reproducibility
seed: 42
